# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod
# Unified next-map line: master now contains all of the old season2 /
# future-map-prep work, so this is the single development version. Real semver
# again (the 99.0.0-season2-dev placeholder is retired). Not released publicly
# yet — public origin/master is 0.2.x, so this 1.0.0 is ahead of the latest
# public tag and the in-mod update alert won't nag testers. Bump as needed;
# cut the actual launch tag (v1.0.0) only when ready to release.
mod_version=1.0.0
maven_group=com.aleks.prisonsmod
archives_base_name=prisonsmod

# Minecraft / Fabric — targeting Paper 1.21.11 server (confirmed 2026-04-18)
# Fabric API version matches user's Prism instance (fabric-api-0.141.3+1.21.11.jar).
# If these versions become stale, check https://fabricmc.net/develop for current values.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.16.10
fabric_version=0.141.3+1.21.11
